<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Extractor Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 30px;
            border-radius: 8px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #007bff;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:hover {
            background: #f9f9f9;
        }

        button.active {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .jobs-section {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f9f9f9;
            border-bottom: 2px solid #ddd;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            color: #666;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .role {
            font-weight: 600;
            color: #007bff;
        }

        .company {
            font-weight: 500;
        }

        .location {
            color: #666;
            font-size: 14px;
        }

        .date {
            color: #999;
            font-size: 13px;
        }

        .btn-interested {
            padding: 6px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-interested:hover {
            border-color: #007bff;
            color: #007bff;
        }

        .btn-interested.interested {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }

        .btn-interested.not-interested {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
        }

        .btn-interested:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state h2 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #666;
        }

        @media (max-width: 768px) {
            table {
                font-size: 13px;
            }

            th, td {
                padding: 10px;
            }

            .controls {
                flex-direction: column;
            }

            input[type="text"] {
                width: 100%;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .role, .company {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Job Dashboard</h1>

            <div class="stats" id="stats">
                <div class="stat-card">
                    <div class="stat-label">Total Jobs</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Unique Companies</div>
                    <div class="stat-value" id="stat-companies">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Marked Interested</div>
                    <div class="stat-value" id="stat-interested">0</div>
                </div>
            </div>

            <div class="controls">
                <input
                    type="text"
                    id="company-filter"
                    placeholder="Filter by company (e.g., Google, Amazon)..."
                />
                <div class="btn-group">
                    <button id="btn-all" class="active">All Jobs</button>
                    <button id="btn-interested">Interested Only</button>
                </div>
            </div>
        </header>

        <div id="error-container"></div>

        <div class="jobs-section">
            <div id="loading" class="loading">Loading jobs...</div>
            <table id="jobs-table" style="display: none;">
                <thead>
                    <tr>
                        <th style="width: 25%;">Role</th>
                        <th style="width: 20%;">Company</th>
                        <th style="width: 15%;">Location</th>
                        <th style="width: 10%;">Experience</th>
                        <th style="width: 12%;">Date</th>
                        <th style="width: 18%;">Action</th>
                    </tr>
                </thead>
                <tbody id="jobs-tbody">
                </tbody>
            </table>
            <div id="empty-state" class="empty-state" style="display: none;">
                <h2>No jobs found</h2>
                <p>Try adjusting your filters</p>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
